name: Build and push image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/tusk-contrib/pg_cron

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read versions from Dockerfile
        id: version
        run: |
          CRON_VERSION="$(grep -oP '^ARG PG_CRON_VERSION=\K\S+' Dockerfile)"
          PG_TAG="$(grep -oP '^FROM ghcr\.io/cloudnative-pg/postgresql:\K\S+' Dockerfile)"
          test -n "${CRON_VERSION}" && test -n "${PG_TAG}"
          echo "cron=v${CRON_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${CRON_VERSION}-${PG_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.cron }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
